name: IntakeTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IntakeTracker:
    type: application
    platform: iOS
    sources:
      - path: IntakeTracker
      - path: Shared
    dependencies:
      - target: IntakeTracker Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTracker
        CODE_SIGN_ENTITLEMENTS: "IntakeTracker/IntakeTracker.entitlements"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.IntakeTracker
        DEVELOPMENT_ASSET_PATHS: "\"IntakeTracker/Preview Content\""
        TARGETED_DEVICE_FAMILY: "1,2"

  IntakeTracker Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "IntakeTracker Watch App"
      - path: Shared
    dependencies:
      - target: IntakeTracker Complications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTracker.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.IntakeTracker
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_ENTITLEMENTS: "IntakeTracker Watch App/IntakeTracker Watch App.entitlements"
        TARGETED_DEVICE_FAMILY: "4"

  IntakeTracker Complications:
    type: app-extension
    platform: watchOS
    sources:
      - path: "IntakeTracker Complications"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTracker.watchkitapp.complications
        CODE_SIGN_ENTITLEMENTS: "IntakeTracker Complications/IntakeTracker Complications.entitlements"
        INFOPLIST_FILE: "IntakeTracker Complications/Info.plist"
        INFOPLIST_KEY_NSExtensionPointIdentifier: "com.apple.widgetkit-extension"

  IntakeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntakeTrackerTests
      - path: Shared
    dependencies:
      - target: IntakeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTrackerTests
        GENERATE_INFOPLIST_FILE: YES
