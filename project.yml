name: IntakeTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IntakeTracker:
    type: application
    platform: iOS
    sources:
      - path: IntakeTracker
      - path: Shared
    dependencies:
      - target: IntakeTracker Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.IntakeTracker
        INFOPLIST_KEY_NSHealthShareUsageDescription: "IntakeTracker reads your sleep data to show how caffeine timing affects how well you sleep."
        CODE_SIGN_ENTITLEMENTS: IntakeTracker/IntakeTracker.entitlements
        DEVELOPMENT_ASSET_PATHS: "\"IntakeTracker/Preview Content\""
        TARGETED_DEVICE_FAMILY: "1,2"

  IntakeTracker Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "IntakeTracker Watch App"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IntakeTracker.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.IntakeTracker
        INFOPLIST_KEY_WKApplication: YES
        TARGETED_DEVICE_FAMILY: "4"
